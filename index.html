<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="FIGURES — people, reimagined as living pixels." />
  <title>FIGURES — Living Pixels</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app" aria-label="FIGURES living pixels">
    <section class="stage" id="stage" aria-label="Live moving pixel figures">
      <canvas id="outputCanvas" aria-label="Animated human figures on a dark background"></canvas>
      <video id="cameraVideo" playsinline autoplay muted aria-hidden="true"></video>

      <header class="topbar">
        <div class="wordmark" aria-label="FIGURES">figures<span>.</span></div>
        <div class="topbar-source" id="activeSource" hidden>
          <span class="live-indicator" id="liveIndicator"><span class="live-dot"></span><span id="sourceLabel">LIVE</span></span>
          <button class="import-inline" type="button" id="importVideoActive" aria-label="Import or replace video">Import video <span aria-hidden="true">↗</span></button>
        </div>
      </header>

      <div class="intro" id="intro">
        <div class="intro-content">
          <p class="eyebrow">AN EXPERIMENT IN SEEING</p>
          <h1>People,<br /><em>reimagined.</em></h1>
          <p class="intro-subtitle">You are the canvas. Move, and watch your figure come alive.</p>
          <div class="start-actions">
            <button class="start-button" id="startButton" type="button">
              <span>Start camera</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
            </button>
            <button class="import-button" id="importVideoButton" type="button">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 9 6 3-6 3V9Z"/></svg>
              <span>Import video</span>
            </button>
          </div>
          <p class="privacy-note">Processed on your device. No uploads or recording.</p>
        </div>
      </div>

      <p class="camera-hint" id="cameraHint" hidden>Step into the frame</p>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

      <div class="color-dock" id="colorDock" hidden>
        <div class="palette-panel" id="palettePanel" hidden>
          <div class="palette-heading"><span>COLOR</span><span class="palette-note">DRAG TO EXPLORE</span></div>
          <div class="sv-field" id="svField" role="slider" aria-label="Choose saturation and brightness" aria-valuetext="Drag to select a color" tabindex="0">
            <span class="sv-cursor" id="svCursor"></span>
          </div>
          <input id="hueSlider" class="hue-slider" type="range" min="0" max="359" value="65" aria-label="Hue" />
          <div class="palette-presets" role="group" aria-label="Quick colors">
            <button class="preset" type="button" style="--preset:#F5FC66" data-color="#F5FC66" aria-label="Acid yellow" aria-pressed="true"></button>
            <button class="preset" type="button" style="--preset:#FF765B" data-color="#FF765B" aria-label="Coral" aria-pressed="false"></button>
            <button class="preset" type="button" style="--preset:#C6A4F7" data-color="#C6A4F7" aria-label="Lavender" aria-pressed="false"></button>
            <button class="preset" type="button" style="--preset:#6BD4DD" data-color="#6BD4DD" aria-label="Cyan" aria-pressed="false"></button>
            <button class="preset" type="button" style="--preset:#FFFFFF" data-color="#FFFFFF" aria-label="White" aria-pressed="false"></button>
          </div>
        </div>
        <button class="color-trigger" id="colorTrigger" type="button" aria-label="Adjust particle color" aria-controls="palettePanel" aria-expanded="false">
          <span class="color-preview" id="colorPreview"></span>
          <span class="control-label">Color</span>
          <span class="color-hex" id="colorHex">#F5FC66</span>
          <svg class="dock-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        </button>
      </div>
    </section>
  </main>
  <input type="file" id="videoFileInput" accept="video/mp4,video/quicktime,video/webm,video/x-m4v,video/*,.mp4,.mov,.m4v,.webm" hidden />
  <script type="module" src="./app.js"></script>
</body>
</html>
